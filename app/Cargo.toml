[package]
name = "openclip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenClip: turn long talks into vertical clips, natively"

[build-dependencies]
cc = "1"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu"] }
rfd = "0.17"
muda = { version = "0.21.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openclip-core = { path = "../crates/core" }
ureq = "2"
whisper-rs = { version = "0.16", features = ["metal"] }
